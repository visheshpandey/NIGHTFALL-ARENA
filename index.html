<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Nightfall Arena</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070b16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #080c17;
            color: #eef3ff;
            font-family: system-ui, sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        button {
            border: 1px solid #536781;
            border-radius: 8px;
            background: #18253b;
            color: white;
            padding: 12px 18px;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #293b57;
        }

        button:disabled {
            opacity: .45;
            cursor: default;
        }

        #hud {
            position: fixed;
            inset: 18px 20px auto;
            display: grid;
            grid-template-columns: 1fr 90px 1fr;
            gap: 20px;
            pointer-events: none;
        }

        .name {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .bar {
            height: 17px;
            background: #172132;
            border: 1px solid #526075;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 100%;
            background: #65e4cf;
        }

        .enemy .fill {
            background: #f27589;
        }

        .stamina {
            margin-top: 5px;
            height: 5px;
            border: 0;
        }

        .stamina .fill {
            background: #eac772;
        }

        #clock {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
        }

        #roundLabel {
            font-size: 11px;
            color: #abbcd4;
        }

        #message {
            position: fixed;
            top: 23%;
            width: 100%;
            text-align: center;
            font-size: clamp(24px, 5vw, 52px);
            font-weight: 900;
            letter-spacing: 5px;
            pointer-events: none;
            text-shadow: 0 4px 20px black;
        }

        #combo {
            position: fixed;
            top: 34%;
            width: 100%;
            text-align: center;
            font-size: clamp(16px, 3vw, 26px);
            font-weight: 800;
            letter-spacing: 3px;
            pointer-events: none;
            text-shadow: 0 3px 14px black;
            opacity: 0;
        }

        #combo.you {
            color: #65e4cf;
        }

        #combo.foe {
            color: #f27589;
        }

        #combo:not(:empty) {
            animation: comboPop 1s ease-out forwards;
        }

        @keyframes comboPop {
            0% {
                opacity: 0;
                transform: scale(0.6) translateY(6px);
            }

            15% {
                opacity: 1;
                transform: scale(1.15) translateY(0);
            }

            30% {
                transform: scale(1);
            }

            75% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(1) translateY(-10px);
            }
        }

        #help {
            position: fixed;
            bottom: 15px;
            width: 100%;
            text-align: center;
            color: #b1bfd3;
            font-size: 12px;
            pointer-events: none;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: #050912bd;
            display: grid;
            place-items: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }

        #panel {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 30px;
            background: #101b2eee;
            border: 1px solid #41516d;
            border-radius: 18px;
            box-shadow: 0 25px 100px #0009;
        }

        h1 {
            margin: 0 0 8px;
            letter-spacing: 3px;
        }

        #description {
            color: #b9c7da;
            line-height: 1.6;
        }

        #stats {
            color: #edcd82;
            margin: 20px 0;
        }

        #actions {
            display: grid;
            gap: 10px;
        }

        #pause,
        #sound {
            position: fixed;
            right: 20px;
            top: 100px;
            font-size: 12px;
            padding: 7px 12px;
        }

        #sound {
            top: 142px;
            z-index: 2;
        }

        #touch {
            position: fixed;
            bottom: max(45px, env(safe-area-inset-bottom));
            left: max(15px, env(safe-area-inset-left));
            right: max(15px, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .pad {
            display: flex;
            gap: 7px;
            align-items: end;
        }

        #touch button {
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-touch-callout: none;
            width: 56px;
            height: 56px;
            padding: 0;
            background: #17273bba;
            font-size: 11px;
        }

        #pause,
        #sound {
            touch-action: none;
        }

        @media (pointer: fine) {
            #touch {
                display: none;
            }
        }

        @media (max-width: 600px) {
            #hud {
                inset: 12px;
                gap: 10px;
                grid-template-columns: 1fr 50px 1fr;
            }

            .name {
                font-size: 10px;
            }

            #help {
                font-size: 10px;
            }

            #panel {
                padding: 22px;
            }
        }

        #rotate {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #070b16;
            color: #eef3ff;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
        }

        #rotate .icon {
            font-size: 48px;
            margin-bottom: 14px;
            animation: tilt 1.6s ease-in-out infinite;
        }

        @keyframes tilt {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        #rotate h2 {
            margin: 0 0 8px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        #rotate p {
            color: #93a5be;
            font-size: 13px;
            margin: 0 0 18px;
            max-width: 260px;
        }

        @media (orientation: portrait) {
            #rotate {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <div id="rotate">
        <div class="icon">&#128241;</div>
        <h2>ROTATE YOUR PHONE</h2>
        <p>Nightfall Arena plays in landscape.</p>
        <button id="lockLandscape">Enable landscape</button>
    </div>
    <div id="hud">
        <div>
            <div class="name"><span id="playerName">YOU</span><span id="playerWins">0 WINS</span></div>
            <div class="bar">
                <div id="playerHP" class="fill"></div>
            </div>
            <div class="bar stamina">
                <div id="playerSP" class="fill"></div>
            </div>
        </div>
        <div id="clock">60<div id="roundLabel">ROUND 1</div>
        </div>
        <div class="enemy">
            <div class="name"><span id="enemyName">OPPONENT</span><span id="enemyWins">0 WINS</span></div>
            <div class="bar">
                <div id="enemyHP" class="fill"></div>
            </div>
            <div class="bar stamina">
                <div id="enemySP" class="fill"></div>
            </div>
        </div>
    </div>
    <div id="message"></div>
    <div id="combo"></div>
    <button id="pause">Pause</button>
    <button id="sound" aria-pressed="true">Sound: On</button>
    <div id="help">A/D: move | W: jump | J: punch | K: kick | L: block | Esc: pause</div>

    <div id="touch">
        <div class="pad">
            <button data-key="a">LEFT</button>
            <button data-key="d">RIGHT</button>
            <button data-key="w">JUMP</button>
        </div>
        <div class="pad">
            <button data-key="l">BLOCK</button>
            <button data-key="j">PUNCH</button>
            <button data-key="k">KICK</button>
        </div>
    </div>

    <div id="overlay">
        <div id="panel">
            <h1 id="title">NIGHTFALL ARENA</h1>
            <p id="description">Loading the arena...</p>
            <div id="stats"></div>
            <div id="actions"></div>
        </div>
    </div>

    <script src="vendor/peerjs.min.js"></script>
    <script type="importmap">
        { "imports": { "three": "./vendor/three.module.js" } }
    </script>
    <script type="module">
        try {
            const THREE = await import(
                "./vendor/three.module.js"
            );
            const { GLTFLoader } = await import("./vendor/jsm/loaders/GLTFLoader.js");
            const { clone: cloneSkinned } = await import("./vendor/jsm/utils/SkeletonUtils.js");

            const $ = id => document.getElementById(id);
            const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
            const SAVE_KEY = "nightfall-arena-v1";
            // Each opponent's fighting style drives AI behavior in updateAI() — not just a
            // difficulty number. HP/damage/reward still scale with aiLevel (the campaign's
            // difficulty curve); this is personality on top of that curve.
            const ROSTER = [
                {
                    name: "ASH",
                    tagline: "A cautious rookie who plays it safe.",
                    style: {
                        reactionBase: 0.24, reactionVar: 0.34,
                        engageDistance: 1.9, approachDistance: 1.55, retreatDistance: 0.9,
                        blockChance: 0.22, kickBias: 0.35, jumpChance: 0.06
                    }
                },
                {
                    name: "VIPER",
                    tagline: "An aggressive rushdown fighter who lives on kicks.",
                    style: {
                        reactionBase: 0.16, reactionVar: 0.26,
                        engageDistance: 2.1, approachDistance: 1.75, retreatDistance: 0.7,
                        blockChance: 0.18, kickBias: 0.6, jumpChance: 0.05
                    }
                },
                {
                    name: "IRON MONK",
                    tagline: "A patient counter-fighter who punishes mistakes.",
                    style: {
                        reactionBase: 0.2, reactionVar: 0.3,
                        engageDistance: 1.85, approachDistance: 1.5, retreatDistance: 1.05,
                        blockChance: 0.55, kickBias: 0.25, jumpChance: 0.03
                    }
                },
                {
                    name: "WRAITH",
                    tagline: "An evasive brawler who jumps in from odd angles.",
                    style: {
                        reactionBase: 0.15, reactionVar: 0.22,
                        engageDistance: 2.0, approachDistance: 1.6, retreatDistance: 1.1,
                        blockChance: 0.3, kickBias: 0.5, jumpChance: 0.16
                    }
                },
                {
                    name: "THE REGENT",
                    tagline: "The arena champion — fast, disciplined, relentless.",
                    style: {
                        reactionBase: 0.11, reactionVar: 0.16,
                        engageDistance: 2.2, approachDistance: 1.65, retreatDistance: 0.85,
                        blockChance: 0.45, kickBias: 0.55, jumpChance: 0.09
                    }
                }
            ];

            let save = { coins: 0, power: 0, vitality: 0, stage: 0, muted: 0 };
            try {
                const stored = JSON.parse(localStorage.getItem(SAVE_KEY));
                if (stored && typeof stored === "object") {
                    for (const key of Object.keys(save)) {
                        if (Number.isFinite(stored[key])) {
                            save[key] = Math.max(0, Math.floor(stored[key]));
                        }
                    }
                    save.stage = Math.min(save.stage, 4);
                    save.power = Math.min(save.power, 8);
                    save.vitality = Math.min(save.vitality, 8);
                    save.muted = save.muted ? 1 : 0;
                }
            } catch { }

            function persist() {
                try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
                catch { }
            }

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090e1d);
            scene.fog = new THREE.Fog(0x090e1d, 16, 42);

            const camera = new THREE.PerspectiveCamera(
                42, innerWidth / innerHeight, 0.1, 100
            );
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.setSize(innerWidth, innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.prepend(renderer.domElement);

            scene.add(new THREE.HemisphereLight(0x97c5ff, 0x222030, 2));
            const moonlight = new THREE.DirectionalLight(0xb0d7ff, 3);
            moonlight.position.set(-4, 9, 5);
            moonlight.castShadow = true;
            moonlight.shadow.mapSize.set(1024, 1024);
            Object.assign(moonlight.shadow.camera, {
                left: -12, right: 12, top: 10, bottom: -10
            });
            scene.add(moonlight);

            function material(color, metalness = 0) {
                return new THREE.MeshStandardMaterial({
                    color, roughness: 0.65, metalness
                });
            }

            function box(parent, w, h, d, mat, x = 0, y = 0, z = 0) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                parent.add(mesh);
                return mesh;
            }

            const stone = material(0x253046);
            box(scene, 20, 0.45, 7, stone, 0, -0.25, 0);
            box(scene, 21, 0.3, 8, material(0x151d2f), 0, -0.6, 0);

            const inlay = material(0x51647d, 0.5);
            for (let x = -9; x <= 9; x += 1.5) {
                box(scene, 0.025, 0.01, 7, inlay, x, -0.018, 0);
            }

            const pillarMat = material(0x1b263d);
            for (const x of [-9, -5, 5, 9]) {
                box(scene, 0.7, 6, 0.7, pillarMat, x, 2.8, -3.8);
                box(scene, 1.1, 0.3, 1.1, stone, x, 5.8, -3.8);
            }
            box(scene, 20, 0.45, 0.9, pillarMat, 0, 6, -3.8);

            const moon = new THREE.Mesh(
                new THREE.SphereGeometry(1.6, 32, 24),
                new THREE.MeshBasicMaterial({ color: 0xd3e6f5 })
            );
            moon.position.set(4, 8, -18);
            scene.add(moon);

            const glowCanvas = document.createElement("canvas");
            glowCanvas.width = glowCanvas.height = 512;
            const glowCtx = glowCanvas.getContext("2d");
            const glowGrad = glowCtx.createRadialGradient(256, 300, 20, 256, 300, 260);
            glowGrad.addColorStop(0, "rgba(255,190,120,0.55)");
            glowGrad.addColorStop(0.35, "rgba(150,120,200,0.28)");
            glowGrad.addColorStop(1, "rgba(9,14,29,0)");
            glowCtx.fillStyle = glowGrad;
            glowCtx.fillRect(0, 0, 512, 512);
            const glow = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 16),
                new THREE.MeshBasicMaterial({
                    map: new THREE.CanvasTexture(glowCanvas),
                    transparent: true, depthWrite: false
                })
            );
            glow.position.set(0, 3, -7.5);
            scene.add(glow);

            for (const x of [-7, 7]) {
                box(scene, 0.3, 1.7, 0.3, stone, x, 0.85, -2.5);
                const flame = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.22),
                    new THREE.MeshBasicMaterial({ color: 0xffb45a })
                );
                flame.position.set(x, 1.95, -2.5);
                scene.add(flame);
                const light = new THREE.PointLight(0xff964c, 13, 9);
                light.position.copy(flame.position);
                scene.add(light);
            }

            // Rigged mocap character setup. Punch/kick/block/hit/KO clips are placeholders
            // (mapped to Idle/Walk/Run below) until real fight clips are captured from Mixamo —
            // see PLAN.md Milestone 4. The state machine and network sync are fully wired now;
            // swapping in real clips later only means editing CLIP_MAP.
            const CLIP_MAP = {
                idle: "Idle", walk: "Walk",
                attack: "Run", jump: "Idle", block: "Idle", hit: "Idle", ko: "Idle"
            };

            function measureHeight(object) {
                const box3 = new THREE.Box3().setFromObject(object);
                return box3.max.y - box3.min.y;
            }

            const fighterGLTF = await new GLTFLoader().loadAsync("./models/Soldier.glb");

            function fighter(color) {
                const root = new THREE.Group();
                scene.add(root);

                const model = cloneSkinned(fighterGLTF.scene);
                model.updateMatrixWorld(true);
                const scale = 2.0 / (measureHeight(model) || 1);
                model.scale.setScalar(scale);
                root.add(model);

                const flatMat = new THREE.MeshBasicMaterial({ color: 0x030405 });
                let skinned = null;
                model.traverse(o => {
                    if (o.isMesh || o.isSkinnedMesh) {
                        o.material = flatMat;
                        o.castShadow = true;
                        o.receiveShadow = false;
                        o.frustumCulled = false;
                        if (o.isSkinnedMesh && !skinned) skinned = o;
                    }
                });

                // Colored accent bands (headband/wrist/ankle) — same visual language as the
                // game's original trim boxes. Bone-attached, so they follow the animation.
                if (skinned) {
                    const accentMat = new THREE.MeshBasicMaterial({ color });
                    const bandOn = (boneName, w, h, d, y = 0) => {
                        const bone = skinned.skeleton.getBoneByName(boneName);
                        if (!bone) return;
                        bone.updateWorldMatrix(true, false);
                        const worldScale = new THREE.Vector3();
                        bone.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), worldScale);
                        const inv = 1 / (worldScale.x || 1);
                        const band = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), accentMat);
                        band.scale.setScalar(inv);
                        band.position.set(0, y * inv, 0);
                        band.frustumCulled = false;
                        bone.add(band);
                    };
                    bandOn("mixamorigHead", 0.24, 0.05, 0.24, 0.15);
                    bandOn("mixamorigLeftForeArm", 0.12, 0.12, 0.12, -0.22);
                    bandOn("mixamorigRightForeArm", 0.12, 0.12, 0.12, -0.22);
                    bandOn("mixamorigLeftLeg", 0.15, 0.06, 0.15, -0.3);
                    bandOn("mixamorigRightLeg", 0.15, 0.06, 0.15, -0.3);
                }

                const mixer = new THREE.AnimationMixer(model);
                const actions = {};
                for (const clip of fighterGLTF.animations) {
                    actions[clip.name] = mixer.clipAction(clip);
                }

                return {
                    root, mixer, actions, currentAction: null,
                    x: 0, y: 0, vy: 0, facing: 1,
                    hp: 100, maxHP: 100, stamina: 100, power: 0,
                    attack: null, cooldown: 0, stun: 0,
                    blocking: false, move: 0, think: 0, guard: 0,
                    comboCount: 0, comboTimer: 0
                };
            }

            const player = fighter(0x67e5d0);
            const enemy = fighter(0xed718b);

            const attacks = {
                punch: { duration: 0.34, impact: 0.14, reach: 1.42, damage: 10, cost: 11 },
                kick: { duration: 0.58, impact: 0.27, reach: 1.95, damage: 18, cost: 22 }
            };

            let state = "menu";
            let timer = 60;
            let round = 1;
            let wins = [0, 0];
            let transition = 0;
            let aiLevel = 0;
            let shake = 0;
            let lastTime = performance.now();
            const keys = new Set();
            const particles = [];

            const ROOM_PREFIX = "nfa-";
            let netRole = null; // 'host' | 'client' | null
            let peer = null;
            let conn = null;
            let remoteKeys = new Set();
            let remoteStats = { power: 0, vitality: 0 };
            let netAccum = 0;
            let clientResultShown = false;
            let onlineLobbyPending = false;

            let audio, masterGain, sfxGain, musicGain, musicFilter;
            let noiseBuffer = null, musicTimer = null, musicStep = 0;
            const MUSIC_VOL = 0.2;

            async function goLandscape() {
                try {
                    if (document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock("landscape");
                    }
                } catch { }
            }

            let landscapeAttempted = false;
            function unlockAudio() {
                if (!landscapeAttempted) { landscapeAttempted = true; goLandscape(); }
                try {
                    if (!audio) {
                        audio = new (window.AudioContext || window.webkitAudioContext)();
                        masterGain = audio.createGain();
                        masterGain.gain.value = save.muted ? 0 : 1;
                        masterGain.connect(audio.destination);
                        sfxGain = audio.createGain();
                        sfxGain.gain.value = 0.85;
                        sfxGain.connect(masterGain);
                        musicGain = audio.createGain();
                        musicGain.gain.value = 0;
                        musicGain.connect(masterGain);
                        musicFilter = audio.createBiquadFilter();
                        musicFilter.type = "lowpass";
                        musicFilter.frequency.value = 520;
                        musicFilter.Q.value = 0.8;
                        musicFilter.connect(musicGain);
                        startMusic();
                    }
                    audio.resume().catch(() => { });
                } catch { }
            }

            function noiseSource() {
                if (!noiseBuffer) {
                    noiseBuffer = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
                    const data = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                }
                const src = audio.createBufferSource();
                src.buffer = noiseBuffer;
                src.loop = true;
                return src;
            }

            function tone(type, from, to, peak, duration, delay = 0, dest, attack = 0.006) {
                const osc = audio.createOscillator();
                const gain = audio.createGain();
                const t = audio.currentTime + delay;
                osc.type = type;
                osc.frequency.setValueAtTime(from, t);
                if (to !== from) osc.frequency.exponentialRampToValueAtTime(to, t + duration);
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(peak, t + attack);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                osc.connect(gain).connect(dest || sfxGain);
                osc.start(t);
                osc.stop(t + duration + 0.03);
            }

            function burst(type, from, to, peak, duration, q = 1, delay = 0, dest) {
                const src = noiseSource();
                const filter = audio.createBiquadFilter();
                const gain = audio.createGain();
                const t = audio.currentTime + delay;
                filter.type = type;
                filter.Q.value = q;
                filter.frequency.setValueAtTime(from, t);
                if (to !== from) filter.frequency.exponentialRampToValueAtTime(to, t + duration);
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(peak, t + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                src.connect(filter).connect(gain).connect(dest || sfxGain);
                src.start(t);
                src.stop(t + duration + 0.03);
            }

            function sound(blocked = false) {
                if (!audio) return;
                if (blocked) {
                    burst("bandpass", 3400, 1900, 0.16, 0.13, 7);
                    tone("square", 618, 540, 0.055, 0.16);
                    tone("square", 947, 880, 0.035, 0.11, 0.005);
                    tone("sine", 130, 70, 0.1, 0.1);
                } else {
                    tone("sine", 165, 44, 0.45, 0.24);
                    tone("triangle", 92, 33, 0.3, 0.19);
                    burst("lowpass", 2600, 320, 0.4, 0.085, 1);
                }
            }

            function soundWhoosh() {
                if (!audio) return;
                burst("bandpass", 620, 2600, 0.09, 0.2, 1.4);
            }

            function soundJump() {
                if (!audio) return;
                tone("sine", 210, 540, 0.13, 0.14);
                burst("highpass", 900, 2400, 0.04, 0.1, 1);
            }

            function soundLand() {
                if (!audio) return;
                tone("sine", 128, 52, 0.2, 0.13);
                burst("lowpass", 1400, 260, 0.11, 0.08, 1);
            }

            function soundKO() {
                if (!audio) return;
                tone("sine", 118, 26, 0.55, 0.95);
                tone("sawtooth", 74, 22, 0.16, 0.7, 0.01);
                burst("lowpass", 1800, 120, 0.3, 0.5, 1);
                tone("sine", 330, 160, 0.09, 0.8, 0.12);
            }

            function soundCombo(count) {
                if (!audio) return;
                const freq = 440 * Math.pow(2, Math.min(count, 10) / 12);
                tone("square", freq, freq * 1.5, 0.055, 0.08);
                tone("sine", freq * 2, freq * 3, 0.045, 0.1, 0.01);
            }

            function soundClick() {
                if (!audio) return;
                tone("square", 880, 620, 0.035, 0.035);
                burst("highpass", 2600, 4200, 0.03, 0.03, 1);
            }

            function padNote(freq) {
                const osc = audio.createOscillator();
                const osc2 = audio.createOscillator();
                const gain = audio.createGain();
                const t = audio.currentTime;
                const len = 3.2 + Math.random() * 2;
                osc.type = "triangle";
                osc2.type = "sine";
                osc.frequency.value = freq;
                osc2.frequency.value = freq * 1.006;
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.linearRampToValueAtTime(0.16, t + len * 0.45);
                gain.gain.linearRampToValueAtTime(0.0001, t + len);
                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(musicFilter);
                osc.start(t); osc2.start(t);
                osc.stop(t + len + 0.05); osc2.stop(t + len + 0.05);
            }

            const padScale = [110, 130.81, 146.83, 164.81, 196, 220, 261.63];

            function musicTick() {
                if (!audio || audio.state !== "running") return;
                musicStep++;
                if (musicStep % 4 === 1) {
                    tone("sine", 72, 38, 0.42, 0.55, 0, musicFilter, 0.02);
                    burst("lowpass", 700, 180, 0.05, 0.3, 1, 0, musicGain);
                }
                if (Math.random() < 0.6) {
                    padNote(padScale[Math.floor(Math.random() * padScale.length)]);
                }
            }

            function startMusic() {
                if (!audio || musicTimer) return;
                for (const [freq, type, level] of [
                    [55, "sine", 0.4], [82.41, "triangle", 0.16], [110, "sine", 0.1]
                ]) {
                    const osc = audio.createOscillator();
                    const gain = audio.createGain();
                    const lfo = audio.createOscillator();
                    const lfoGain = audio.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = level;
                    lfo.type = "sine";
                    lfo.frequency.value = 0.03 + Math.random() * 0.05;
                    lfoGain.gain.value = level * 0.4;
                    lfo.connect(lfoGain).connect(gain.gain);
                    osc.connect(gain).connect(musicFilter);
                    osc.start(); lfo.start();
                }
                const sweep = audio.createOscillator();
                const sweepGain = audio.createGain();
                sweep.type = "sine";
                sweep.frequency.value = 0.017;
                sweepGain.gain.value = 260;
                sweep.connect(sweepGain).connect(musicFilter.frequency);
                sweep.start();
                musicGain.gain.setValueAtTime(0.0001, audio.currentTime);
                musicGain.gain.linearRampToValueAtTime(MUSIC_VOL, audio.currentTime + 4);
                musicTimer = setInterval(musicTick, 2200);
            }

            function setMusicLevel(level) {
                if (!audio || !musicGain) return;
                musicGain.gain.cancelScheduledValues(audio.currentTime);
                musicGain.gain.setTargetAtTime(level, audio.currentTime, 0.4);
            }

            function startMatch() {

            function endRound() {

                const e = enemy.hp / enemy.maxHP;

                    $("message").textContent = "DRAW";

            function sendMsg(obj) {

            const ICE_CONFIG = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:global.stun.twilio.com:3478" },
                    {
                        urls: "turn:openrelay.metered.ca:80",
                        username: "openrelayproject", credential: "openrelayproject"
                    },
                    {
                        urls: "turn:openrelay.metered.ca:443",
                        username: "openrelayproject", credential: "openrelayproject"
                    },
                    {
                        urls: "turn:openrelay.metered.ca:443?transport=tcp",
                        username: "openrelayproject", credential: "openrelayproject"
                    }
                ]
            };

            function wireConnection() {
                const timeoutId = setTimeout(() => {
                    if (!conn || !conn.open) {
                        onlineError({
                            message: "Connection timed out — this can happen on strict networks. " +
                                "Try again, or connect both devices to the same Wi-Fi."
                        });
                    }
                }, 15000);
                conn.on("open", () => {
                    clearTimeout(timeoutId);
                    sendMsg({ t: "hello", power: save.power, vitality: save.vitality });
                });
                conn.on("data", handleNetMessage);
                conn.on("close", onlinePeerLeft);
                conn.on("error", onlinePeerLeft);
            }

            function handleNetMessage(msg) {
                if (!msg || typeof msg !== "object") return;
                if (msg.t === "hello") {
                    remoteStats = {
                        power: clamp(Math.floor(msg.power) || 0, 0, 8),
                        vitality: clamp(Math.floor(msg.vitality) || 0, 0, 8)
                    };
                    if (netRole === "host") startOnlineMatch();
                } else if (msg.t === "input" && netRole === "host") {
                    remoteKeys = new Set(msg.keys);
                } else if (msg.t === "state" && netRole === "client") {
                    applyState(msg);
                } else if (msg.t === "leave") {
                    onlinePeerLeft();
                }
            }

            function snapshotFighter(f) {
                return {
                    x: f.x, y: f.y, vy: f.vy, facing: f.facing,
                    hp: f.hp, maxHP: f.maxHP, stamina: f.stamina,
                    attack: f.attack ? { kind: f.attack.kind, time: f.attack.time, hit: f.attack.hit } : null,
                    cooldown: f.cooldown, stun: f.stun, blocking: f.blocking, move: f.move,
                    comboCount: f.comboCount
                };
            }

            function applyState(msg) {
                if (onlineLobbyPending) {
                    onlineLobbyPending = false;
                    $("overlay").style.display = "none";
                    state = "onlineClient";
                }
                const prevPlayerCombo = player.comboCount;
                const prevEnemyCombo = enemy.comboCount;
                Object.assign(player, msg.player);
                Object.assign(enemy, msg.enemy);
                if (player.comboCount > prevPlayerCombo && player.comboCount >= 2) {
                    showCombo(player, player.comboCount);
                }
                if (enemy.comboCount > prevEnemyCombo && enemy.comboCount >= 2) {
                    showCombo(enemy, enemy.comboCount);
                }
                timer = msg.timer;
                round = msg.round;
                wins = msg.wins;
                $("message").textContent = msg.message;
                if (msg.matchOver) {
                    if (!clientResultShown) {
                        clientResultShown = true;
                        showOnlineResultPanel(wins[1] === 2);
                    }
                } else if (clientResultShown) {
                    clientResultShown = false;
                    $("overlay").style.display = "none";
                }
            }

                for (const { label, action, disabled = false } of actions) {

                    $("actions").append(button);
                }
            }

            function copyText(text) {

            function fallbackCopy(text) {
                const area = document.createElement("textarea");
                area.value = text;
                area.style.cssText = "position:fixed;top:-1000px;opacity:0;";

                area.select();

            const FATAL_PEER_ERRORS = new Set([
                "peer-unavailable", "unavailable-id", "invalid-id", "invalid-key",
                "browser-incompatible", "webrtc", "ssl-unavailable"
            ]);

            function wirePeerResilience() {
                let retries = 0;
                peer.on("error", err => {
                    if (FATAL_PEER_ERRORS.has(err?.type)) { onlineError(err); return; }
                    if (conn && conn.open) {
                        try { peer.reconnect(); } catch { }
                        return;
                    }
                    if (retries < 3) {
                        retries++;
                        try { peer.reconnect(); } catch { }
                    } else {
                        onlineError(err);
                    }
                });
                peer.on("disconnected", () => {
                    if (conn && conn.open) {
                        try { peer.reconnect(); } catch { }
                    }
                });
            }

            function hostGame() {
                try {
                    netRole = "host";
                    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                    const code = Array.from({ length: 5 },
                        () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
                    renderLobby("HOSTING MATCH", "Share this code with your friend:",
                        code, "Waiting for your friend to join…");
                    peer = new Peer(ROOM_PREFIX + code, { config: ICE_CONFIG });
                    peer.on("connection", c => {
                        if (conn) { c.close(); return; }
                        conn = c;
                        renderLobby("HOSTING MATCH", "Share this code with your friend:",
                            code, "Friend found — connecting…");
                        wireConnection();
                        conn.on("open", () => {
                            renderLobby("HOSTING MATCH", "Share this code with your friend:",
                                code, "Friend connected! Starting…");
                        });
                    });
                    wirePeerResilience();
                } catch (err) { onlineError(err); }
            }

            function joinGame(rawCode) {
                try {
                    const code = rawCode.trim().toUpperCase();

                    netRole = "client";
                    renderLobby("JOINING MATCH", "", "", "Connecting…");

                        renderLobby("JOINING MATCH", "", "", "Found host — connecting…");

                            renderLobby("JOINING MATCH", "", "", "Connected! Waiting for match to start…");

            }

            function startOnlineMatch() {
                player.power = save.power * 2;
                enemy.power = remoteStats.power * 2;
                player.maxHP = 100 + save.vitality * 12;
                enemy.maxHP = 100 + remoteStats.vitality * 12;
                $("playerName").textContent = "YOU";
                $("enemyName").textContent = "FRIEND";
                $("pause").textContent = "Leave";
                $("overlay").style.display = "none";
                clientResultShown = false;
                wins = [0, 0];
                round = 1;
                startRound();
            }

            function applyRemoteInput() {
                enemy.move = Number(remoteKeys.has("d")) - Number(remoteKeys.has("a"));
                enemy.blocking = remoteKeys.has("l") && !enemy.attack &&
                    enemy.y === 0 && enemy.stun <= 0 && enemy.stamina > 0;
                if (remoteKeys.has("w")) { jump(enemy); remoteKeys.delete("w"); }
                if (remoteKeys.has("j")) beginAttack(enemy, "punch");
                else if (remoteKeys.has("k")) beginAttack(enemy, "kick");
            }

            function beginAttack(f, kind) {
                const spec = attacks[kind];
                if (state !== "fight" || f.attack || f.cooldown > 0 ||
                    f.stun > 0 || f.blocking || f.stamina < spec.cost) return;
                f.stamina -= spec.cost;
                f.attack = { kind, time: 0, hit: false };
                f.cooldown = spec.duration + 0.12;
                soundWhoosh();
            }

            function jump(f) {
                if (f.y === 0 && f.stun <= 0 && !f.attack &&
                    !f.blocking && f.stamina >= 8) {
                    f.vy = 6;
                    f.stamina -= 8;
                    soundJump();
                }
            }

            const sparkGeometry = new THREE.SphereGeometry(0.035, 5, 4);
            const sparkMaterials = [
                new THREE.MeshBasicMaterial({ color: 0xffcd77 }),
                new THREE.MeshBasicMaterial({ color: 0xa3e8ff })
            ];

            function sparks(x, y, blocked) {
                for (let i = 0; i < 12; i++) {
                    const mesh = new THREE.Mesh(sparkGeometry, sparkMaterials[blocked ? 1 : 0]);
                    mesh.position.set(x, y, 0.3);
                    scene.add(mesh);
                    particles.push({
                        mesh, life: 0.35,
                        vx: (Math.random() - 0.5) * 7,
                        vy: Math.random() * 4,
                        vz: (Math.random() - 0.5) * 4
                    });
                }
            }

            function showCombo(attacker, count) {
                const combo = $("combo");
                combo.textContent = `${count} HIT COMBO`;
                combo.className = attacker === player ? "you" : "foe";
                combo.style.animation = "none";
                void combo.offsetWidth;
                combo.style.animation = "";
                soundCombo(count);
            }

            function hit(attacker, defender, spec) {
                const dx = defender.x - attacker.x;
                if (Math.abs(dx) > spec.reach ||
                    dx * attacker.facing < 0 ||
                    Math.abs(attacker.y - defender.y) > 0.9) return;

                const guarding = defender.blocking &&
                    defender.facing * (attacker.x - defender.x) > 0;
                const blocked = guarding && defender.stamina >= 12;

                if (blocked) {
                    attacker.comboCount = 0;
                    attacker.comboTimer = 0;
                } else {
                    attacker.comboCount = attacker.comboTimer > 0 ? attacker.comboCount + 1 : 1;
                    attacker.comboTimer = 1.1;
                    defender.comboCount = 0;
                    defender.comboTimer = 0;
                    if (attacker.comboCount >= 2) showCombo(attacker, attacker.comboCount);
                }

                const comboBonus = blocked ? 0 : Math.min(attacker.comboCount - 1, 5) * 2;
                const damage = spec.damage + attacker.power + comboBonus;
                defender.hp = Math.max(0, defender.hp - damage * (blocked ? 0.15 : 1));
                if (guarding) defender.stamina = Math.max(0, defender.stamina - 12);

                defender.stun = blocked ? 0.08 : 0.23;
                if (!blocked) defender.attack = null;
                defender.x = clamp(
                    defender.x + attacker.facing * (blocked ? 0.12 : 0.36), -8, 8
                );
                shake = blocked ? 0.045 : 0.13;
                sparks((attacker.x + defender.x) / 2, attacker.y + 1.5, blocked);
                sound(blocked);
                if (defender.hp <= 0) soundKO();
            }

            function updateFighter(f, opponent, dt) {
                f.cooldown = Math.max(0, f.cooldown - dt);
                f.stun = Math.max(0, f.stun - dt);
                f.stamina = Math.min(
                    100, f.stamina + dt * (f.attack ? 3 : f.blocking ? 7 : 19)
                );
                f.comboTimer = Math.max(0, f.comboTimer - dt);
                if (f.comboTimer <= 0) f.comboCount = 0;

                if (!f.attack && f.stun <= 0) {
                    f.facing = opponent.x >= f.x ? 1 : -1;
                    f.x = clamp(f.x + f.move * dt * (f.blocking ? 1.3 : 3.5), -8, 8);
                }

                if (f.y > 0 || f.vy > 0) {
                    const airborne = f.y > 0;
                    f.vy -= 17 * dt;
                    f.y = Math.max(0, f.y + f.vy * dt);
                    if (f.y === 0) {
                        if (airborne) soundLand();
                        f.vy = 0;
                    }
                }

                if (f.attack) {
                    const attack = f.attack;
                    const spec = attacks[attack.kind];
                    attack.time += dt;
                    if (!attack.hit && attack.time >= spec.impact) {
                        attack.hit = true;
                        hit(f, opponent, spec);
                    }
                    if (attack.time >= spec.duration) f.attack = null;
                }
            }

            function updateAI(dt) {
                const style = ROSTER[aiLevel].style;
                const distance = Math.abs(player.x - enemy.x);
                enemy.think -= dt;
                enemy.guard = Math.max(0, enemy.guard - dt);
                enemy.blocking = enemy.guard > 0 && !enemy.attack &&
                    enemy.y === 0 && enemy.stamina > 12 && enemy.stun <= 0;
                enemy.move = distance > style.approachDistance ? Math.sign(player.x - enemy.x)
                    : distance < style.retreatDistance ? -Math.sign(player.x - enemy.x) : 0;

                if (enemy.think > 0 || enemy.stun > 0) return;
                enemy.think = style.reactionBase + Math.random() * style.reactionVar;

                if (player.attack && distance < 2.1 && Math.random() < style.blockChance) {
                    enemy.guard = 0.3 + Math.random() * 0.25;
                } else if (distance < style.engageDistance) {
                    beginAttack(enemy, distance > 1.35 || Math.random() < style.kickBias ? "kick" : "punch");
                } else if (distance < 3 && Math.random() < style.jumpChance) {
                    jump(enemy);
                }
            }

            function separateFighters() {
                if (Math.abs(player.y - enemy.y) > 1.2) return;
                const dx = enemy.x - player.x;
                if (Math.abs(dx) >= 0.85) return;
                const sign = dx >= 0 ? 1 : -1;
                const correction = (0.85 - Math.abs(dx)) / 2;
                player.x = clamp(player.x - correction * sign, -8, 8);
                enemy.x = clamp(enemy.x + correction * sign, -8, 8);
            }

            function playClip(f, name, fade) {
                const next = f.actions[name];
                if (!next || f.currentAction === next) return;
                next.reset().setEffectiveWeight(1).play();
                if (f.currentAction) next.crossFadeFrom(f.currentAction, fade, false);
                f.currentAction = next;
            }

            // Pure function of state already carried on the fighter (all of it already
            // present in snapshotFighter(), so the networked client derives the same clip
            // as the host — no extra sync needed). See CLIP_MAP for the current placeholder
            // clip assignments pending real Mixamo fight clips (PLAN.md Milestone 4).
            function selectClip(f) {
                if (f.hp <= 0) return "ko";
                if (f.stun > 0) return "hit";
                if (f.attack) return "attack";
                if (f.y !== 0) return "jump";
                if (f.blocking) return "block";
                if (f.move) return "walk";
                return "idle";
            }

            function animateFighter(f, dt) {
                f.root.position.set(f.x, f.y, 0);
                f.root.rotation.y = f.facing === 1 ? 0 : Math.PI;

                const key = selectClip(f);
                const fastCut = key === "attack" || key === "hit" || key === "ko";
                playClip(f, CLIP_MAP[key], fastCut ? 0.05 : 0.12);
                f.mixer.update(dt);

                if (f.hp <= 0) {
                    f.root.rotation.z = -f.facing * 1.35;
                    f.root.position.y = 0.35;
                } else {
                    f.root.rotation.z = 0;
                }
            }

            function updateHUD() {
                $("playerHP").style.width = `${player.hp / player.maxHP * 100}%`;
                $("enemyHP").style.width = `${enemy.hp / enemy.maxHP * 100}%`;
                $("playerSP").style.width = `${player.stamina}%`;
                $("enemySP").style.width = `${enemy.stamina}%`;
                $("clock").firstChild.nodeValue = String(Math.ceil(timer));
                $("roundLabel").textContent = `ROUND ${round}`;
                $("playerWins").textContent = `${wins[0]} WINS`;
                $("enemyWins").textContent = `${wins[1]} WINS`;
            }

            function pause() {
                if (state !== "fight") return;
                state = "paused";
                keys.clear();
                setMusicLevel(MUSIC_VOL * 0.25);
                showPanel("PAUSED", "The arena can wait.", [
                    { label: "Resume", action: resume },
                    { label: "Return to camp", action: menu }
                ]);
            }

            function resume() {
                state = "fight";
                $("overlay").style.display = "none";
                lastTime = performance.now();
                setMusicLevel(MUSIC_VOL);
            }

            $("pause").onclick = () => {
                unlockAudio();
                soundClick();
                if (netRole) leaveOnline();
                else state === "paused" ? resume() : pause();
            };

            $("sound").onclick = () => {
                unlockAudio();
                setMuted(!save.muted);
                soundClick();
            };
            setMuted(save.muted);

            function sendClientInput() {
                if (netRole === "client") sendMsg({ t: "input", keys: [...keys] });
            }

            const controls = new Set(["a", "d", "w", "j", "k", "l", "escape"]);
            addEventListener("keydown", event => {
                const key = event.key.toLowerCase();
                if (!controls.has(key)) return;
                event.preventDefault();
                if (event.repeat) return;
                unlockAudio();
                if (key === "escape") {
                    if (netRole) leaveOnline();
                    else state === "paused" ? resume() : pause();
                } else if (state === "fight" || state === "onlineClient") {
                    keys.add(key);
                    sendClientInput();
                }
            });
            addEventListener("keyup", event => {
                keys.delete(event.key.toLowerCase());
                sendClientInput();
            });
            addEventListener("blur", () => {
                keys.clear();
                if (netRole === "client") sendClientInput();
                else if (!netRole) pause();
            });
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    setMusicLevel(0);
                    keys.clear();
                    if (netRole === "client") sendClientInput();
                    else if (!netRole) pause();
                } else {
                    setMusicLevel(state === "paused" ? MUSIC_VOL * 0.25 : MUSIC_VOL);
                }
            });

            document.querySelectorAll("[data-key]").forEach(button => {
                button.addEventListener("contextmenu", event => event.preventDefault());
                button.addEventListener("pointerdown", event => {
                    event.preventDefault();
                    unlockAudio();
                    button.setPointerCapture(event.pointerId);
                    if (state === "fight" || state === "onlineClient") {
                        keys.add(button.dataset.key);
                        sendClientInput();
                    }
                });
                for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
                    button.addEventListener(type, () => {
                        keys.delete(button.dataset.key);
                        sendClientInput();
                    });
                }
            });

            addEventListener("resize", () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            function frame(now) {
                requestAnimationFrame(frame);
                const dt = Math.min((now - lastTime) / 1000, 0.033);
                lastTime = now;

                if (!netRole || netRole === "host") {
                    if (state === "intro" || state === "roundEnd") {
                        transition -= dt;
                        if (transition <= 0) {
                            if (state === "intro") {
                                state = "fight";
                                $("message").textContent = "";
                            } else if (wins[0] === 2 || wins[1] === 2) {
                                if (netRole) {
                                    state = "result";
                                    $("message").textContent = "";
                                    showOnlineResultPanel(wins[0] === 2);
                                } else {
                                    endMatch();
                                }
                            } else {
                                round++;
                                startRound();
                            }
                        }
                    } else if (state === "fight") {
                        timer = Math.max(0, timer - dt);
                        player.move = Number(keys.has("d")) - Number(keys.has("a"));
                        player.blocking = keys.has("l") && !player.attack &&
                            player.y === 0 && player.stun <= 0 && player.stamina > 0;

                        if (keys.has("w")) { jump(player); keys.delete("w"); }
                        if (keys.has("j")) beginAttack(player, "punch");
                        else if (keys.has("k")) beginAttack(player, "kick");

                        if (netRole === "host") applyRemoteInput();
                        else updateAI(dt);
                        updateFighter(player, enemy, dt);
                        if (enemy.hp > 0) updateFighter(enemy, player, dt);
                        separateFighters();

                        if (player.hp <= 0 || enemy.hp <= 0 || timer <= 0) endRound();
                    }
                }

                if (netRole === "host") {
                    netAccum += dt;
                    if (netAccum >= 1 / 30) {
                        netAccum = 0;
                        sendMsg({
                            t: "state",
                            player: snapshotFighter(player),
                            enemy: snapshotFighter(enemy),
                            timer, round, wins,
                            message: $("message").textContent,
                            matchOver: state === "result"
                        });
                    }
                }

                if (state !== "paused") {
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.life -= dt;
                        p.vy -= dt * 12;
                        p.mesh.position.x += p.vx * dt;
                        p.mesh.position.y += p.vy * dt;
                        p.mesh.position.z += p.vz * dt;
                        p.mesh.scale.setScalar(Math.max(0, p.life / 0.35));
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            particles.splice(i, 1);
                        }
                    }
                    shake *= Math.exp(-dt * 18);
                }

                animateFighter(player, dt);
                animateFighter(enemy, dt);
                updateHUD();

                const center = (player.x + enemy.x) / 2;
                const span = Math.max(7, Math.abs(player.x - enemy.x) + 5);
                const distance = Math.max(11, span / (0.72 * camera.aspect));
                camera.position.set(
                    center * 0.6 + (Math.random() - 0.5) * shake,
                    3.8 + (Math.random() - 0.5) * shake,
                    distance
                );
                camera.lookAt(center * 0.6, 1.4, 0);
                renderer.render(scene, camera);
            }

            resetFighter(player, -2.5);
            resetFighter(enemy, 2.5);
            menu();
            requestAnimationFrame(frame);
            document.getElementById("lockLandscape").addEventListener("click", goLandscape);

        } catch (error) {
            console.error(error);
            document.getElementById("title").textContent = "STARTUP ERROR";
            document.getElementById("description").textContent =
                "The game could not start. Check your internet connection and use a " +
                "WebGL-capable browser with hardware acceleration enabled. Details: " +
                error.message;
        }
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => { });
            });
        }
    </script>
</body>

</html>
